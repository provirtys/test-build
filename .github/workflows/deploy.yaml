name: Build and Deploy Storybooks

on:
  push:
    branches: [ test/github-pages ]

permissions:
  contents: write

jobs:
  build-base-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # обновите до v4

      - name: Setup Node.js
        uses: actions/setup-node@v4  # v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4  # официальный action
        with:
          version: latest

      - run: pnpm install
      - run: pnpm --filter base-ui build
      - run: pnpm --filter base-ui build:storybook
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/base-ui/storybook-static
          branch: test/github-pages
          target-folder: base-ui

  build-platforms:
    needs: build-base-ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ desktop-ui, mobile-ui, tablet-ui ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm  # ← ДОБАВЬТЕ ЭТОТ ШАГ!
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: pnpm install
      - run: pnpm --filter ${{ matrix.platform }} build:storybook
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/${{ matrix.platform }}/storybook-static
          branch: test/github-pages
          target-folder: ${{ matrix.platform }}

  deploy-root-storybook:
    needs: build-platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # унифицируйте версию
          cache: 'pnpm'

      - name: Install pnpm  # ← И СЮДА ТОЖЕ!
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: pnpm install
      - run: pnpm build-storybook  # уберите --filter, если root в корне
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static  # если root в корне
          branch: test/github-pages
          target-folder: root
