name: Build and Deploy Storybooks

on:
  push:
    branches: [ test/github-pages ]

permissions:
  contents: write

jobs:
  build-base-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter base-ui build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/base-ui/storybook-static
          branch: gh-pages
          target-folder: base-ui  # your-repo.github.io/base-ui/

  build-platforms:
    needs: build-base-ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ desktop, mobile, tablet ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter ${{ matrix.platform }} build-storybook -o storybook-static
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/${{ matrix.platform }}/storybook-static
          branch: gh-pages
          target-folder: ${{ matrix.platform }}

  deploy-root-storybook:
    needs: build-platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --filter root-storybook build-storybook -o storybook-static
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/root-storybook/storybook-static
          branch: gh-pages
          target-folder: root
