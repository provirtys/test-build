name: Build and Deploy Storybooks

on:
  push:
    branches: [ test/github-pages ]

permissions:
  contents: write

jobs:
  build-all-storybooks:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build base-ui (lib)
        run: pnpm --filter base-ui build

      - name: Build base-ui Storybook
        run: pnpm --filter base-ui build:storybook

      - name: Build platform Storybooks
        run: |
          pnpm --filter desktop-ui build:storybook
          pnpm --filter mobile-ui build:storybook
          pnpm --filter tablet-ui build:storybook

      - name: Deploy base-ui
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/base-ui/storybook-static
          branch: test/github-pages
          target-folder: base-ui

      - name: Deploy desktop-ui
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/desktop-ui/storybook-static
          branch: test/github-pages
          target-folder: desktop-ui

      - name: Deploy mobile-ui
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/mobile-ui/storybook-static
          branch: test/github-pages
          target-folder: mobile-ui

      - name: Deploy tablet-ui
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/tablet-ui/storybook-static
          branch: test/github-pages
          target-folder: tablet-ui

  deploy-root-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - run: pnpm install

      - name: Build root Storybook
        run: pnpm storybook build  # если root в корне

      - name: Deploy root Storybook
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static  # если root в корне
          branch: test/github-pages
          target-folder: root
